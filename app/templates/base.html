<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deflectly — {% block title %}{% endblock %}</title>
<style>
  :root { --ink:#1a1a1a; --mut:#666; --line:#e2e2e0; --acc:#0a6e3c; --bg:#fafaf8; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 -apple-system, "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { border-bottom:1px solid var(--line); padding:14px 24px; display:flex; justify-content:space-between; align-items:baseline; background:#fff; }
  header .logo { font-weight:700; letter-spacing:-0.02em; font-size:18px; }
  header .logo span { color:var(--acc); }
  header nav a { margin-left:18px; color:var(--mut); text-decoration:none; font-size:14px; }
  header nav a.on { color:var(--ink); font-weight:600; }
  main { max-width:880px; margin:0 auto; padding:32px 24px 64px; }
  h1 { font-size:26px; letter-spacing:-0.02em; margin:0 0 6px; }
  .sub { color:var(--mut); margin:0 0 28px; font-size:15px; }
  .panel { border:1px solid var(--line); background:#fff; border-radius:6px; padding:20px; }
  .row { display:flex; gap:16px; }
  .row > * { flex:1; }
  button, .btn { background:var(--acc); color:#fff; border:0; border-radius:5px; padding:10px 18px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  button.ghost, .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  textarea { width:100%; min-height:220px; border:1px solid var(--line); border-radius:5px; padding:12px; font:13px/1.5 ui-monospace, Menlo, monospace; resize:vertical; }
  .steps { font-size:13px; color:var(--mut); margin-bottom:20px; }
  .steps b { color:var(--ink); }
  .log { font:13px/1.7 ui-monospace, Menlo, monospace; background:#111; color:#9fe8b5; border-radius:5px; padding:14px; min-height:120px; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:14px; background:#fff; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); font-weight:600; }
  .score { font-weight:700; }
  .good { color:var(--acc); }
  .bad { color:#a33; }
  .mid { color:#a8720a; }
  .kpi { display:flex; gap:16px; margin:20px 0; }
  .kpi > div { flex:1; border:1px solid var(--line); background:#fff; border-radius:6px; padding:16px 18px; }
  .kpi .num { font-size:28px; font-weight:700; letter-spacing:-0.02em; }
  .kpi .lbl { font-size:13px; color:var(--mut); margin-top:2px; }
  .price { border:1px solid var(--line); background:#fff; border-radius:6px; padding:22px; }
  .price h3 { margin:0 0 4px; }
  .price .p { font-size:26px; font-weight:700; }
  .price ul { padding-left:18px; color:var(--mut); font-size:14px; }
  .price.hot { border-color:var(--acc); border-width:2px; }
  .note { font-size:13px; color:var(--mut); }
  .flash { border:1px solid var(--line); background:#fff; border-left:3px solid var(--acc); padding:10px 14px; border-radius:4px; margin-bottom:16px; font-size:14px; }
  code { font-size:13px; background:#f0f0ee; padding:1px 5px; border-radius:3px; }
</style>
</head>
<body>
<header>
  <div class="logo">Deflect<span>ly</span></div>
  <nav>
    <a href="/demo" class="{{ 'on' if step==1 }}">1 · Tickets</a>
    <a href="/review" class="{{ 'on' if step==2 }}">2 · Review</a>
    <a href="/train" class="{{ 'on' if step==3 }}">3 · Train</a>
    <a href="/compare" class="{{ 'on' if step==4 }}">4 · Compare</a>
    <a href="/pricing" class="{{ 'on' if step==5 }}">5 · Go live</a>
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
