name: Bug report
description: Something in the demo, the API, or the deploy behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Multi-worker bugs are the ones that hide. If you can, reproduce with two workers:
        `PORT=8451 gunicorn app.app:app --bind 0.0.0.0:8451 --workers 2 --timeout 120`
  - type: input
    id: what
    attributes:
      label: What happened
      placeholder: e.g. /api/train returned 400 "Review and approve your tickets" right after approving them
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /api/sample
        2. POST /api/review with 56 pairs
        3. POST /api/train  -> 400
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Response bodies, `pytest -q` output, or `python3 scripts/smoke.py <url>` output
    validations:
      required: false
  - type: input
    id: how
    attributes:
      label: How you're running it
      placeholder: python3 app.py | gunicorn --workers 2 | Docker | Railway | https://deflectly-production.up.railway.app
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python and scikit-learn version
      placeholder: python3 -V; python3 -c "import sklearn; print(sklearn.__version__)"
    validations:
      required: false
